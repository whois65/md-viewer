<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Viewer</title>
    <script>window.MathJax = { tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] }, svg: { fontCache: "global" } };</script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="mathjax-script"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">MD</div>
        <div class="sep"></div>

        <!-- File menu -->
        <div class="menu-wrap">
            <button class="btn" id="fileMenuBtn">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"
                    stroke-width="1.5">
                    <path d="M3 2h6l3 3v9H3z" />
                    <path d="M9 2v3h3" />
                </svg>File</button>

            <button class="btn" id="helpBtn"><b style="font-size: 16px;">?</b> Help </button>

            <div class="dropdown" id="fileMenu">
                <button class="dd-item" id="openBtn">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M2 5h5l1.5-2H14v9H2z" />
                    </svg>
                    Open file…
                </button>
                <input type="file" id="mdFile" accept=".md,.txt" hidden />
                <div class="dd-sep"></div>
                <button class="dd-item" id="exportMD">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M3 2h7l3 3v9H3z" />
                        <path d="M8 7v5m-2-2 2 2 2-2" />
                    </svg>
                    Save as .md
                </button>
                <button class="dd-item" id="exportHtml">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M4 3l-2 5 2 5m8-10 2 5-2 5M9 2l-2 12" />
                    </svg>
                    Export as HTML
                </button>
                <button class="dd-item" id="exportPdf">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M3 2h6l3 3v9H3z" />
                        <path d="M6 9h4M6 11h2" />
                    </svg>
                    Export as PDF
                </button>
                <div class="dd-sep"></div>
                <button class="dd-item danger" id="clearBtn" style="color:#ef4444;">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M3 5h10l-.8 8H3.8z" />
                        <path d="M5 5V3h6v2M1 5h14" />
                    </svg>
                    Clear
                </button>
            </div>
        </div>

        <div class="sep"></div>

        <!-- View tabs -->
        <div class="view-tabs">
            <button class="view-tab" data-mode="editor">Editor</button>
            <button class="view-tab active" data-mode="split">Split</button>
            <button class="view-tab" data-mode="preview">Preview</button>
        </div>

        <div class="spacer"></div>

        <!-- TOC toggle -->
        <button class="btn btn-icon" id="tocToggle" title="Toggle table of contents">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M2 4h12M2 8h8M2 12h10" />
            </svg>
        </button>

        <!-- Find -->
        <button class="btn btn-icon" id="findToggle" title="Find & Replace (Ctrl+F)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="6.5" cy="6.5" r="4" />
                <path d="M11 11l3 3" />
            </svg>
        </button>

        <!-- Dark mode -->
        <button class="btn btn-icon" id="darkToggle" title="Toggle dark mode">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path
                    d="M8 1v2M8 13v2M1 8h2M13 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M3.5 12.5l1.4-1.4M11.1 4.9l1.4-1.4" />
                <circle cx="8" cy="8" r="3.5" />
            </svg>
        </button>

        <!-- Copy -->
        <button class="btn btn-icon" id="copyBtn" title="Copy markdown">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="5" y="5" width="9" height="9" rx="1" />
                <path d="M3 11V2h9" />
            </svg>
        </button>
    </header>

    <!-- Toolbar (formatting shortcuts) -->
    <div class="toolbar">
        <div class="toolbar-group">
            <button class="tb-btn" data-wrap="**" title="Bold">
                <svg viewBox="0 0 14 14" fill="currentColor">
                    <path d="M3 2h5a3 3 0 010 6H3zm0 6h5.5a3 3 0 010 6H3z" opacity=".8" />
                </svg><span>B</span></button>
            <button class="tb-btn" data-wrap="*" title="Italic">
                <svg viewBox="0 0 14 14" fill="currentColor">
                    <path d="M5 2h6M3 12h6M6 2l-2 10" stroke="currentColor" stroke-width="1.4" fill="none" />
                </svg><span>I</span></button>
            <button class="tb-btn" data-wrap="~~" title="Strikethrough">
                <svg viewBox="0 0 14 14" fill="none"
                    stroke="currentColor" stroke-width="1.3">
                    <line x1="2" y1="7" x2="12" y2="7" />
                    <path d="M4 4c0-1.1 1.3-2 3-2s3 .9 3 2M4 10c0 1.1 1.3 2 3 2s3-.9 3-2" />
                </svg><span>S</span></button>
            <button class="tb-btn" data-wrap="`" title="Inline code">
                <svg viewBox="0 0 14 14" fill="none"
                    stroke="currentColor" stroke-width="1.4">
                    <path d="M5 4l-3 3 3 3M9 4l3 3-3 3" />
                </svg><span>Code</span></button>
        </div>
        <div class="tb-sep"></div>
        <div class="toolbar-group">
            <button class="tb-btn" data-prefix="# " title="Heading 1"><span>H1</span></button>
            <button class="tb-btn" data-prefix="## " title="Heading 2"><span>H2</span></button>
            <button class="tb-btn" data-prefix="### " title="Heading 3"><span>H3</span></button>
        </div>
        <div class="tb-sep"></div>
        <div class="toolbar-group">
            <button class="tb-btn" data-prefix="- " title="Bullet list">
                <svg viewBox="0 0 14 14" fill="none"
                    stroke="currentColor" stroke-width="1.3">
                    <circle cx="2" cy="4" r="1" fill="currentColor" />
                    <circle cx="2" cy="7" r="1" fill="currentColor" />
                    <circle cx="2" cy="10" r="1" fill="currentColor" />
                    <line x1="5" y1="4" x2="12" y2="4" />
                    <line x1="5" y1="7" x2="12" y2="7" />
                    <line x1="5" y1="10" x2="12" y2="10" />
                </svg><span>List</span></button>
            <button class="tb-btn" data-prefix="1. " title="Ordered list">
                <svg viewBox="0 0 14 14" fill="none"
                    stroke="currentColor" stroke-width="1.3">
                    <path d="M2 3v3" stroke-width="1" />
                    <line x1="5" y1="4" x2="12" y2="4" />
                    <line x1="5" y1="7" x2="12" y2="7" />
                    <line x1="5" y1="10" x2="12" y2="10" />
                </svg><span>Ordered</span></button>
            <button class="tb-btn" data-prefix="> " title="Blockquote">
                <svg viewBox="0 0 14 14" fill="currentColor">
                    <path d="M1 3h2v4H1zm5 0h2v4H6zm-5 5h2v1H1zm5 0h2v1H6z" opacity=".7" />
                </svg><span>Quote</span></button>
            <button class="tb-btn" data-insert="---\n" title="Horizontal rule">
                <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
                    <line x1="2" y1="7" x2="12" y2="7" />
                </svg><span>HR</span></button>
        </div>
        <div class="tb-sep"></div>
        <button class="tb-btn" data-insert="[text](url)" title="Link">
            <svg viewBox="0 0 14 14" fill="none"
                stroke="currentColor" stroke-width="1.3">
                <path d="M6 8a3 3 0 004.2.4l1.8-1.8a3 3 0 00-4.2-4.2L6.9 3.3" />
                <path d="M8 6a3 3 0 00-4.2-.4L2 7.4a3 3 0 004.2 4.2l.9-.9" />
            </svg><span>Link</span></button>
        <button class="tb-btn" data-insert="![alt](url)" title="Image">
            <svg viewBox="0 0 14 14" fill="none"
                stroke="currentColor" stroke-width="1.3">
                <rect x="1" y="3" width="12" height="8" rx="1" />
                <path d="M1 9l3-3 2.5 2.5 2-2L12 9" />
                <circle cx="4.5" cy="6" r="1" fill="currentColor" stroke="none" />
            </svg><span>Image</span></button>
        <button class="tb-btn"
            data-insert="| Col 1 | Col 2 | Col 3 |\n|-------|-------|-------|\n| A     | B     | C     |\n"
            title="Table">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3">
                <rect x="1" y="1" width="12" height="12" rx="1" />
                <line x1="1" y1="5" x2="13" y2="5" />
                <line x1="5" y1="5" x2="5" y2="13" />
                <line x1="9" y1="5" x2="9" y2="13" />
            </svg><span>Table</span></button>
        <button class="tb-btn" id="emojiBtn">
            <svg viewBox="0 0 100 100" width="100" height="100">
                <circle cx="50" cy="50" r="45" fill="#FFD233" stroke="#E6B400" stroke-width="3" />
                <circle cx="35" cy="40" r="5" fill="#2C2C2C" />
                <circle cx="65" cy="40" r="5" fill="#2C2C2C" />
                <path d="M 30,55 A 20,20 0 0,0 70,55 Z" fill="#2C2C2C" />
            </svg>
            <span>Emoji</span></button>
    </div>

    <!-- Find bar -->
    <div class="find-bar hidden" id="findBar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
            style="width:14px;height:14px;color:var(--muted);flex-shrink:0">
            <circle cx="6.5" cy="6.5" r="4" />
            <path d="M11 11l3 3" />
        </svg>
        <input type="text" id="findInput" placeholder="Find…" />
        <input type="text" id="replaceInput" placeholder="Replace with…" />
        <button class="tb-btn" id="findPrev">↑</button>
        <button class="tb-btn" id="findNext">↓</button>
        <button class="tb-btn" id="replaceOne">Replace</button>
        <button class="tb-btn" id="replaceAll">All</button>
        <span class="find-count" id="findCount"></span>
        <button class="tb-btn" style="margin-left:auto" id="findClose">✕</button>
    </div>

    <!-- Workspace -->
    <div class="workspace" id="workspace">
        <div class="editor-pane" id="editorPane">
            <textarea id="editor" spellcheck="false"></textarea>
        </div>
        <div class="divider" id="divider"></div>
        <div class="preview-pane" id="previewPane">
            <div id="output"></div>
        </div>
        <div class="toc-sidebar hidden" id="tocSidebar">
            <div class="toc-title">Contents</div>
            <div id="tocList"></div>
        </div>
    </div>

    <div class="statusbar">
        <span class="status-pill"><span class="saved-dot" id="savedDot"></span> <span
                id="savedLabel">Saved</span></span>
        <span id="wordCount">0 words</span>
        <span id="charCount">0 chars</span>
        <span id="lineCount">0 lines</span>
        <div class="spacer"></div>
        <span id="cursorPos">Ln 1, Col 1</span>
    </div>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>

</html>
